<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <meta name="theme-color" content="#00ff41">
  <meta name="color-scheme" content="dark">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ get_url(path='/style.css') }}">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬛</text></svg>">
</head>
<body>
  <!-- Matrix Rain Canvas -->
  <canvas id="matrix-canvas"></canvas>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <a href="{{ get_url(path='/') }}" class="logo">The VPuNk</a>

      <nav>
        <ul class="nav-links" id="navLinks">
          <li><a href="{{ get_url(path='/news') }}">news</a></li>
          <li><a href="{{ get_url(path='/blog') }}">blog</a></li>
          <li><a href="#subscribe">subscribe</a></li>
          <li><a href="#contact">contact</a></li>
        </ul>
      </nav>

      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p class="copyright">
      &copy; {{ now() | date(format="%Y") }} <a href="{{ config.base_url }}">{{ config.title }}</a>
      <br>
      <span class="text-muted">{{ config.extra.author }}</span>
    </p>
  </footer>

  <!-- Scripts -->
  <script src="{{ get_url(path='/matrix.js') }}"></script>
  <script>
    // Mobile menu toggle
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');
    if (hamburger && navLinks) {
      hamburger.addEventListener('click', () => {
        navLinks.classList.toggle('open');
      });
      document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => navLinks.classList.remove('open'));
      });
    }
  </script>
</body>
</html>
